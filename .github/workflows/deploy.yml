# Deploy the static frontend to GitHub Pages.
# The frontend is static only; it talks to the LIVE Netlify backend
# (https://ib-dp-platform.netlify.app) for /api and /figures, configured at
# build time via VITE_API_BASE_URL / VITE_FIGURES_BASE_URL below.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: npm install && npm run build
        env:
          VITE_API_BASE_URL: https://ib-dp-platform.netlify.app
          VITE_FIGURES_BASE_URL: https://ib-dp-platform.netlify.app

      - name: SPA fallback (404.html -> index.html)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
