# Deploy the static frontend to GitHub Pages.
# The frontend is static only; it talks to the LIVE backends configured at build
# time via VITE_API_BASE_URL / VITE_FIGURES_BASE_URL below. The two MUST differ:
# the API lives on Cloudflare, the figures only exist on Netlify.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & build frontend
        working-directory: frontend
        run: npm install && npm run build
        env:
          # API -> Cloudflare: the CURRENT backend. Netlify's copy is 17 days stale
          # and has no /api/ask, so pointing this at Netlify makes the per-question
          # "Ask AI" 404 (the old AskAI.tsx then unmounted itself entirely).
          VITE_API_BASE_URL: https://ib-dp-platform-api.pages.dev
          # Figures -> Netlify: the only host with a /figures route. Cloudflare has
          # no such route at all, so this cannot follow the API host.
          VITE_FIGURES_BASE_URL: https://ib-dp-platform.netlify.app

      - name: SPA fallback (404.html -> index.html)
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
